# yamlfmt configuration for this repository
# Check: yamlfmt -lint .   Format: yamlfmt .

continue_on_error: false
line_ending: lf

formatter:
  type: basic
  indent: 2
  eof_newline: true
  trim_trailing_whitespace: true
  max_line_length: 0
  retain_line_breaks: true
  include_document_start: false
  pad_line_comments: 1
