onboarding = false

[ui]
copy_on_select = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

sidebar_collapsed_mode = "hidden"
tab_bar_right = [
  { type = "command", command = "$HOME/.config/herdr/status.sh", interval_seconds = 1, timeout_seconds = 2 },
]
tab_bar_right_separator = " "


[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[theme]
name = "kanagawa"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+ctrl+v"
split_horizontal = "prefix+ctrl+s"

[worktrees]
directory = "~/.local/share/herdr/worktrees"
