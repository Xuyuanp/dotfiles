[tools]
erlang = "latest"
node = "24"
python = "3.14"
elixir = "latest"
neovim = "0.12.5"

[env]
# moved from zshrc so the same env applies in every shell (zsh, bash, fish)
PIP_INDEX_URL = "https://mirrors.aliyun.com/pypi/simple"
PIPENV_PYPI_MIRROR = "{{env.PIP_INDEX_URL}}"

NVM_NODEJS_ORG_MIRROR = "https://npmmirror.com/mirrors/node/"

BAT_THEME = "kanagawa"

LC_ALL = "en_US.UTF-8"
LANG = "en_US.UTF-8"

GOPATH = "{{env.HOME}}/go"

RUSTUP_DIST_SERVER = "https://rsproxy.cn"
RUSTUP_UPDATE_ROOT = "https://rsproxy.cn/rustup"

HOMEBREW_BREW_GIT_REMOTE = "https://mirrors.ustc.edu.cn/brew.git"
HOMEBREW_NO_ASK = "1"

PI_ANSWER_MODEL_PROVIDER = "llama.cpp"
PI_ANSWER_MODEL_NAME = "gemma-4-E2B-it-Q4_0"
PI_EXPERIMENTAL = "1"

PYTHON_BUILD_MIRROR_URL = "https://registry.npmmirror.com/-/binary/python"
PYTHON_BUILD_MIRROR_URL_SKIP_CHECKSUM = "1"

_.path = ["~/.local/bin", "{{env.GOPATH}}/bin", "~/.krew/bin", "~/.cargo/bin"]
